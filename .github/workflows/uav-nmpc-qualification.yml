name: UAV NMPC qualification (archived fallback)\non:\n  workflow_dispatch:\njobs:\n  qualify:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 350\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with: {python-version: '3.12'}\n      - run: pip install casadi==3.7.2 scipy==1.16.1 numpy==2.5.2\n      - name: Download and verify official workspace\n        run: |\n          curl -L --retry 15 -o dataset.zip 'https://zenodo.org/records/4379168/files/dataset.zip?download=1'\n          echo 'ff012bec9c5206a312eb18d664f760fe821e8cb9b4c2c65ea8f6bf9462960934  dataset.zip' | sha256sum -c -\n          unzip -q dataset.zip 'dataset/data/mpc/comparison/01/workspace.mat'\n      - name: Archived compatible-interface fallback\n        working-directory: aris_nature_agents_v7\n        run: |\n          python uav_causal_validation/test_python_translation.py\n          python uav_causal_validation/smoke_test_casadi_nmpc.py ../dataset/data/mpc/comparison/01/workspace.mat --backend ipopt\n          python uav_causal_validation/run_casadi_closed_loop.py ../dataset/data/mpc/comparison/01/workspace.mat --backend ipopt\n          python uav_causal_validation/qualify_nmpc_replay.py ../dataset/data/mpc/comparison/01/workspace.mat uav_causal_validation/results/casadi_free_run.jsonl\n      - uses: actions/upload-artifact@v4\n        if: always()\n        with:\n          name: uav-nmpc-qualification\n          path: aris_nature_agents_v7/uav_causal_validation/results/\n